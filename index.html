<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">Projecte LlenguAI</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="container header-container">
            <div class="header-nav">
                <div class="lang-selector">
                    <button class="lang-btn active" data-lang="ca">Català / Valencià</button>
                    <button class="lang-btn" data-lang="an">Aranés</button>
                    <button class="lang-btn" data-lang="es">Castellano</button>
                    <button class="lang-btn" data-lang="en">English</button>
                    <button class="lang-btn" data-lang="fr">Français</button>
                    <button class="lang-btn" data-lang="pt">Português</button>
                </div>
                <div class="nav-right">
                    <span class="project-tag">Projecte LlenguAI</span>
                    <button id="admin-login-btn" class="btn-admin" data-i18n="btn_admin">Pujar Prompts</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="illustration-container">
            <img src="https://www.uv.es/senex/imatgeLlenguaAI.png" alt="Projecte LlenguAI" class="central-illustration">
        </div>

        <section class="section-card section-sl">
            <h3 class="section-title"><span class="badge-badge badge-sl">SL</span> <span data-i18n="socio_title">Situació sociolingüística</span></h3>
            <div class="form-group">
                <label data-i18n="lbl_ambit_sl">Consulta la situació sociolingüística d'un poble, una comarca, un sector laboral, un col·lectiu, etc.:</label>
                <p class="trial-notice">[Període de prova de la plataforma: només dades del País Valencià]</p>
                <input type="text" id="socioling-search" data-i18n-placeholder="ph_ambit_sl" placeholder="Escriu un poble, comarca, sector laboral...">
            </div>
        </section>

        <section class="section-card section-dl">
            <h3 class="section-title"><span class="badge-badge badge-dl">DL</span> <span data-i18n="didactic_title">Didàctica de la llengua</span></h3>
            <div class="form-group">
                <label data-i18n="lbl_materia_didactic">Indiqueu matèria del prompt de didàctica de la llengua, nivell educatiu, etc.:</label>
                <input type="text" id="didactic-search" data-i18n-placeholder="ph_materia_didactic" placeholder="Escriu la matèria, nivell educatiu (Primària, Secundària...)">
            </div>
            <button class="btn-secondary" data-i18n="btn_download_form">📥 Descarregueu el formulari</button>
        </section>

        <section class="section-card section-nl">
            <h3 class="section-title"><span class="badge-badge badge-nl">NL</span> <span data-i18n="nl_title">Prompts de normalització lingüística</span></h3>
            <div class="form-group">
                <label data-i18n="lbl_materia_nl">Indiqueu matèria del prompt de normalització lingüística:</label>
                <p class="trial-notice">[Període de prova de la plataforma: només dades de Catalunya]</p>
                <input type="text" id="nl-search" data-i18n-placeholder="ph_materia_nl" placeholder="Escriu la matèria o àmbit (Administració local, comerç, mitjans...)">
            </div>
            <button class="btn-secondary" data-i18n="btn_download_form_nl">📥 Descarregueu el formulari</button>
        </section>

        <div class="search-container">
            <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="Cercar prompts per paraula clau, matèria, autor...">
        </div>

        <section>
            <h2 class="list-title" data-i18n="list_prompts_title">Relació de prompts</h2>
            <div id="prompts-container" class="prompts-grid">
            </div>
        </section>

    </main>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h2 data-i18n="admin_panel_title">Panell de Gestió de Prompts</h2>
            <form id="add-prompt-form">
                <div class="form-group">
                    <label data-i18n="prompt_title_label">Títol del Prompt</label>
                    <input type="text" id="new-prompt-title" required>
                </div>
                <div class="form-group">
                    <label data-i18n="prompt_author_label">Nom de la persona que carrega el prompt</label>
                    <input type="text" id="new-prompt-author" required>
                </div>
                <div class="form-group">
                    <label data-i18n="prompt_type_label">Tipus de Prompt</label>
                    <select id="new-prompt-type" required>
                        <option value="sl" data-i18n="opt_type_socio">Situació Sociolingüística (SL)</option>
                        <option value="dl" data-i18n="opt_type_didactic">Prompt mestre de didàctica (DL)</option>
                        <option value="nl" data-i18n="opt_type_nl">Prompt mestre de normalització (NL)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-i18n="prompt_cat_label">Matèria / Àmbit</label>
                    <input type="text" id="new-prompt-category">
                </div>
                <div class="form-group">
                    <label data-i18n="prompt_body_label">Contingut del Prompt</label>
                    <textarea id="new-prompt-body" rows="6" required></textarea>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1rem;">
                    <button type="button" id="btn-close-modal" class="btn-cancel" data-i18n="btn_cancel">Cancel·lar</button>
                    <button type="submit" class="btn-primary" data-i18n="btn_save_prompt">Guardar Prompt</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js?v=7"></script>
</body>
</html>
